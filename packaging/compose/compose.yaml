services:
  server:
    image: ${AEL_IMAGE:?set the fixed AEL image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-ael}-server
    restart: unless-stopped
    command:
      - server
      - start
      - --data-dir
      - /data
      - --addr
      - 0.0.0.0:7332
      - --origin
      - ${AEL_PUBLIC_ORIGIN:?set the actual public HTTPS origin}
      - --trusted-proxy
      - ${AEL_PROXY_IP:-172.30.0.2}/32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - server_data:/data
    networks:
      backend:
        ipv4_address: ${AEL_SERVER_IP:-172.30.0.3}
    healthcheck:
      test: [CMD, /ael, server, health, --url, "http://127.0.0.1:7332", --json]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
  operator:
    image: ${AEL_IMAGE:?set the fixed AEL image reference}
    profiles: [tools]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - server_data:/data
      - backup_data:/backup
    healthcheck:
      disable: true
  proxy:
    image: ${CADDY_IMAGE:?set the fixed official Caddy image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-ael}-proxy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      AEL_SITE_HOST: ${AEL_SITE_HOST:?set the actual site hostname}
    ports:
      - ${AEL_BIND_IP:-127.0.0.1}:${AEL_HTTPS_PORT:-8443}:443
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    networks:
      backend:
        ipv4_address: ${AEL_PROXY_IP:-172.30.0.2}
networks:
  backend:
    ipam:
      config:
        - subnet: ${AEL_NETWORK_CIDR:-172.30.0.0/29}
volumes:
  server_data:
  proxy_data:
  proxy_config:
  backup_data:
