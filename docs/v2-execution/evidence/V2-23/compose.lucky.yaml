services:
  server:
    image: ${AEL_IMAGE:?set the fixed AEL image reference}
    container_name: ael-v2-server
    restart: unless-stopped
    command:
      - server
      - start
      - --data-dir
      - /data
      - --addr
      - 0.0.0.0:7332
      - --origin
      - ${AEL_PUBLIC_ORIGIN:?set the actual origin}
      - --trusted-proxy
      - 172.31.240.1/32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - 127.0.0.1:17332:7332
    volumes:
      - server_data:/data
    networks:
      backend:
        ipv4_address: 172.31.240.3
    healthcheck:
      test: [CMD, /ael, server, health, --url, "http://127.0.0.1:7332", --json]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
  operator:
    image: ${AEL_IMAGE:?set the fixed AEL image reference}
    profiles: [tools]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - server_data:/data
      - backup_data:/backup
    healthcheck:
      disable: true
networks:
  backend:
    ipam:
      config:
        - subnet: 172.31.240.0/29
volumes:
  server_data:
  backup_data:
