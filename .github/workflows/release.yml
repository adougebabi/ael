name: AEL distribution
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publication:
        description: 'Build artifacts, create a draft, or publish a signed release.'
        type: choice
        default: build_artifact
        options: [build_artifact, draft, released]
      release_tag:
        description: 'Existing version tag to build. Required only when selecting an older release commit.'
        type: string
        default: ''
concurrency:
  group: >-
    ael-distribution-${{
      startsWith(github.ref, 'refs/tags/') && format('dispatch-{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && inputs.publication != 'build_artifact' && format('publish-{0}', inputs.release_tag || github.sha) ||
      'build-main'
    }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  dispatch-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch trusted main release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = {'ref': 'main', 'inputs': {'publication': 'released', 'release_tag': os.environ['RELEASE_TAG']}}
          Path(os.environ['RUNNER_TEMP'], 'release-dispatch.json').write_text(json.dumps(request))
          PY
          gh api --method POST "repos/$GH_REPO/actions/workflows/release.yml/dispatches" --input "$RUNNER_TEMP/release-dispatch.json"
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publication: ${{ steps.metadata.outputs.publication }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      version_tag: ${{ steps.metadata.outputs.version_tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - name: Validate source and publication
        id: metadata
        env:
          PUBLICATION: ${{ inputs.publication || 'build_artifact' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          source_commit=$(git rev-parse HEAD)
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/bootstrap/bootstrap.go)
          if [ "$PUBLICATION" != build_artifact ]; then
            [ "$WORKFLOW_REF" = refs/heads/main ] || { echo 'Run publication from the main workflow.' >&2; exit 1; }
            expected_tag="v$version"
            [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "$expected_tag" ] || { echo 'Tag and source version differ.' >&2; exit 1; }
            tag_commit=$(git rev-parse --verify "refs/tags/$expected_tag^{commit}")
            [ "$tag_commit" = "$source_commit" ] || { echo 'Tag and source commit differ.' >&2; exit 1; }
            git merge-base --is-ancestor "$source_commit" origin/main
          fi
          echo "publication=$PUBLICATION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Test and build all packages
        env:
          RELEASE_PUBLICATION: ${{ steps.metadata.outputs.publication }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          go test ./... -count=1
          python3 -m unittest discover -s scripts -p 'test_server_*.py' -v
          python3 scripts/release_publish_acceptance.py --out "$RUNNER_TEMP/publish-tests.json"
          sh scripts/package.sh
          python3 scripts/remote_agent_acceptance.py --binary dist/ael-linux-amd64 --out "$RUNNER_TEMP/remote-agent-acceptance" --verify-recovery --verify-delivery
          python3 scripts/server_image.py --manifest dist/release/manifest.json --platform linux-amd64 --tag ael-server:ci-amd64
          python3 scripts/server_image.py --manifest dist/release/manifest.json --platform linux-arm64 --tag ael-server:ci-arm64
          dist/ael-linux-amd64 release verify --manifest dist/release/manifest.json --json
      - name: Sign and verify final manifest
        env:
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign sign-blob dist/release/manifest.json --bundle dist/release/manifest.sigstore.json --yes
          cosign verify-blob dist/release/manifest.json --bundle dist/release/manifest.sigstore.json --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@v4
        with:
          name: ael-distribution
          path: dist/release/
          if-no-files-found: error
  publish:
    if: needs.build.outputs.publication == 'draft' || needs.build.outputs.publication == 'released' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ael-publication-${{ needs.build.outputs.version_tag }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.registry.outputs.image }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: ael-distribution
          path: release
      - name: Check immutable version publication
        if: needs.build.outputs.publication != 'build_artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLICATION: ${{ needs.build.outputs.publication }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: python3 scripts/release_publish.py --manifest release/manifest.json --publication "$PUBLICATION" --check
      - name: Push multi-platform image to Docker Hub
        id: registry
        if: needs.build.outputs.publication != 'draft'
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          PUBLICATION: ${{ needs.build.outputs.publication }}
        run: |
          [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_ACCESS_TOKEN" ] || { echo 'Configure DOCKER_HUB_USERNAME and DOCKER_HUB_ACCESS_TOKEN repository secrets.' >&2; exit 1; }
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" | docker login docker.io --username "$DOCKER_HUB_USERNAME" --password-stdin
          image="${DOCKERHUB_IMAGE:-${DOCKER_HUB_USERNAME,,}/ael-server}"
          case "$image" in docker.io/*) ;; *) image="docker.io/$image" ;; esac
          if [ "$PUBLICATION" = build_artifact ]; then
            python3 scripts/server_registry.py --manifest release/manifest.json --image "$image" --main
          else
            python3 scripts/server_registry.py --manifest release/manifest.json --image "$image"
          fi
      - uses: actions/upload-artifact@v4
        if: needs.build.outputs.publication != 'draft'
        with:
          name: ael-dockerhub
          path: release/server-registry.json
          if-no-files-found: error
      - name: Publish verified tagged source
        if: needs.build.outputs.publication != 'build_artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLICATION: ${{ needs.build.outputs.publication }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: python3 scripts/release_publish.py --manifest release/manifest.json --publication "$PUBLICATION"
